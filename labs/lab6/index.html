    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>

    <style>
        *{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            text-align: center;
            margin: 25px;
            background-color: rgb(255, 255, 255);
        }

        .card{
            background-color: rgb(112, 168, 164);
            margin: auto;
            padding: 20px;
            border-radius: 16px;
            border: solid rgb(0, 0, 0) ;
        }
        #card2{
            text-align: left;
            background-color: rgb(255, 255, 255);
            margin: auto;
            padding: 20px;
            border-radius: 16px;
            border: solid black ;
        }

        .card3{
            text-align: center;
            background-color: rgb(255, 255, 255);
            margin: auto;
            padding: 5px;
            border-radius: 16px;
            border: solid black ;
        }

        .card4{
            text-align: center;
            background-color: rgb(255, 255, 255);
            margin: auto;
            padding: 5px;
            border-radius: 16px;
            border: solid black ;
        }

        .courseCard{
            text-align: left;
            margin: auto;
            padding: 5px;
            border-radius: 16px;
            border: none;
        }


        button{
            margin: 30px;
            background-color: rgb(179, 218, 218);
            border: solid rgb(0, 0, 0) ;
            padding: 20px;
            border-radius: 12px;
            width: 20%;
        }
        
        #course{
            width: 500px;
            height: 30px;
            border: solid black ;
            border-radius: 8px;
        }

        .tableCard{
            display: flex;
            justify-content: center;
            text-align: center;
            margin: auto;
            padding: 5px;
            border-radius: 16px;
            border: none;

        }

        #table{
            border: solid;
            width: 100%;
        }

        #colName{
            background-color: white;
            height: 40px;
        }

        .tblBtn{
            margin: 30px;
            background-color: rgb(179, 218, 218);
            border: solid rgb(0, 0, 0) ;
            padding: 20px;
            width: 20%;
        }

        #course{
            width: 100%;
            height: 40px;
        }

        

        @media (max-width: 680px) {
            body {
                margin: 12px 6px;
            }
            .card {
                padding: 14px 10px;
            }
            button, .tblBtn {
                width: calc(50% - 16px);
                margin: 6px 4px;
                padding: 12px 6px;
                font-size: 0.85rem;
            }
            #changeTitle, #hideProfile, #showProfile {
                width: calc(33% - 8px);
                min-width: 80px;
                padding: 10px 4px;
            }
            .tableCard {
                overflow-x: auto;
            }
            #table {
                min-width: 300px;
            }
        }
    </style>

    <body>

        <div class="card">
            <h1 id="title">My Student Profile</h1>
            <p id="subtitle">Welcome to my Interactive Profile!</p>

            <div id="card2">
                <h3>Student Information</h3>
                <p>Name: <b id="name">Andrei Geronimo</b></p>
                <p>Course: <b id="courseProfile"></b></p>
                <p>Year: <b id="year">3rd Year</b></p>
            </div>

            <br>
            
            <button id="changeTitle">Change</button>
            <button id="hideProfile">Hide Profile</button>
            <button id="showProfile">Show Profile</button>

            <div class="card3">
                <h4 id="buttonLog">Output</h4>
            </div>

            <br><hr>

            <div class="courseCard">
                <h3>Choose Your Course:</h3>

                <select id="course">
                    <option value="" disabled selected>Select Course</option>
                    <option value="BSIT">BSIT</option>
                    <option value="BSCS">BSCS</option>
                </select>

            </div>

            <br><br>
            <div class="card4">
                <h4 id="courseLog">Output</h4>
            </div>

            <hr>

            <div class="tableCard">
                
                <table border="2" id="table">

                    <tr id="colName">
                        <th>No.</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Year</th>
                    </tr>

                    <tr>
                        <td>1</td>
                        <td>Juan</td>
                        <td>BSIT</td>
                        <td>3rd Year</td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>Andrei</td>
                        <td>BSIT</td>
                        <td>2nd Year</td>
                    </tr>

                    <tr>
                        <td>3</td>
                        <td>Ed</td>
                        <td>BSCS</td>
                        <td>1st Year</td>
                    </tr>

                    <tr>
                        <td>4</td>
                        <td>Kasilag</td>
                        <td>BSIT</td>
                        <td>2nd Year</td>
                    </tr>

                </table>

            </div>
            <button id="btnOdd" class="tblBtn">Apply CSS Odd</button>
            <button id="btnEven" class="tblBtn">Apply CSS Even</button>
            <button id="btnHide" class="tblBtn">Hide</button>
            <button id="btnShow" class="tblBtn">Show</button>

            <div class="card4">
                <h4 id="tableLog">Output</h4>
            </div>


        </div>
        
        <script src="script.js"></script>


    </body>
    </html>

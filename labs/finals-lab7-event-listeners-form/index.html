<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="section-card">

        <div>
            <img class="img" src="miyamoto.jpg" alt="">
        </div>

        <form class="form-card">
            <h1 id="student-name">Hello!</h1>

            <label>Username</label><br>
            <input type="text" id="username" placeholder="Enter your username"><br><br>

            <label>Password</label><br>
            <input type="text" id="password" placeholder="Enter your password"><br><br>

            <button id="submit">Submit</button>
            <button id="double">Double-click</button>
            <button id="press-hold">Press & Hold</button>

            <p id="output"></p>
        </form>

    </section>


    <script src="script.js"></script>
    
</body>
</html>

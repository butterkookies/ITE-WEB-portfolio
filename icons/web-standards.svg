<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Globe / Web Standards circle -->
  <circle cx="56" cy="56" r="42" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
  <!-- Globe Latitudes / Longitudes -->
  <ellipse cx="56" cy="56" rx="22" ry="42" stroke="#38bdf8" stroke-width="3" stroke-dasharray="2 0"/>
  <line x1="14" y1="56" x2="98" y2="56" stroke="#38bdf8" stroke-width="3"/>
  <line x1="22" y1="36" x2="90" y2="36" stroke="#bae6fd" stroke-width="2.5"/>
  <line x1="22" y1="76" x2="90" y2="76" stroke="#bae6fd" stroke-width="2.5"/>
  <line x1="56" y1="14" x2="56" y2="98" stroke="#38bdf8" stroke-width="3"/>

  <!-- Code / Standard Badge in center of globe -->
  <rect x="36" y="44" width="40" height="24" rx="4" fill="#0369a1" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
  <text x="56" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">W3C</text>

  <!-- SEO Magnifying Glass with Ranking Arrow -->
  <g filter="drop-shadow(0 4px 6px rgba(0,0,0,0.25))">
    <!-- Glass circle -->
    <circle cx="86" cy="86" r="26" fill="#ffffff" stroke="#0284c7" stroke-width="5"/>
    <circle cx="86" cy="86" r="21" fill="#f0f9ff"/>
    <!-- Handle -->
    <path d="M104 104l16 16" stroke="#0369a1" stroke-width="8" stroke-linecap="round"/>
    
    <!-- SEO Keyword / Trend Arrow inside Glass -->
    <path d="M74 94l8-8 6 6 12-14" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M92 78h8v8" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

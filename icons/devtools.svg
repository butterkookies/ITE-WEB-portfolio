<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Outer Browser Window -->
  <rect x="10" y="16" width="108" height="96" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Browser Window Header -->
  <rect x="10" y="16" width="108" height="20" rx="8" fill="#334155"/>
  <rect x="10" y="28" width="108" height="8" fill="#334155"/>
  
  <!-- Window Control Dots -->
  <circle cx="22" cy="26" r="4" fill="#ef4444"/>
  <circle cx="34" cy="26" r="4" fill="#f59e0b"/>
  <circle cx="46" cy="26" r="4" fill="#10b981"/>
  
  <!-- Window URL bar -->
  <rect x="58" y="21" width="52" height="10" rx="3" fill="#1e293b"/>
  
  <!-- Left Side: Web Page Content Preview -->
  <rect x="16" y="42" width="44" height="62" rx="4" fill="#f8fafc"/>
  <rect x="22" y="48" width="24" height="5" rx="1.5" fill="#38bdf8"/>
  <rect x="22" y="57" width="32" height="3" rx="1" fill="#cbd5e1"/>
  <rect x="22" y="63" width="28" height="3" rx="1" fill="#cbd5e1"/>
  <rect x="22" y="70" width="32" height="14" rx="2" fill="#e0f2fe"/>
  <!-- Inspect selection highlight box on preview -->
  <rect x="20" y="68" width="36" height="18" rx="3" fill="#38bdf8" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="2 2"/>
  
  <!-- Right Side: Developer Tools Console / Elements Inspector Panel -->
  <rect x="66" y="42" width="46" height="62" rx="4" fill="#0f172a"/>
  <!-- DevTools tab bar -->
  <rect x="66" y="42" width="46" height="12" rx="4" fill="#1e293b"/>
  <text x="70" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="6.5" font-weight="700" fill="#38bdf8">Elements</text>
  <text x="98" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="6" fill="#64748b">Console</text>
  
  <!-- DOM Tree / Inspect code lines -->
  <text x="70" y="63" font-family="Consolas, Monaco, monospace" font-size="6.5" fill="#f43f5e">&lt;<tspan fill="#38bdf8">div</tspan>&gt;</text>
  <text x="74" y="72" font-family="Consolas, Monaco, monospace" font-size="6.5" fill="#f43f5e">&lt;<tspan fill="#f59e0b">h1</tspan>&gt;<tspan fill="#e2e8f0">...</tspan>&lt;/<tspan fill="#f59e0b">h1</tspan>&gt;</text>
  <text x="70" y="81" font-family="Consolas, Monaco, monospace" font-size="6.5" fill="#f43f5e">&lt;/<tspan fill="#38bdf8">div</tspan>&gt;</text>
  
  <!-- Console prompt divider -->
  <line x1="68" y1="87" x2="110" y2="87" stroke="#334155" stroke-width="1"/>
  <!-- Console prompt symbol -->
  <text x="70" y="97" font-family="Consolas, Monaco, monospace" font-size="8" font-weight="bold" fill="#10b981">&gt;</text>
  <rect x="76" y="92" width="18" height="5" rx="1" fill="#475569"/>
  <!-- Blinking cursor -->
  <rect x="96" y="91" width="2" height="7" fill="#38bdf8"/>

  <!-- Inspect Mouse Pointer Arrow -->
  <g filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))">
    <path d="M52 64l8 20-3 1-3-7-4 5V64z" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
